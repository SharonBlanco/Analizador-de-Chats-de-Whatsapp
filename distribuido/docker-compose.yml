# RabbitMQ para el procesamiento en paralelo (corre en la PC del coordinador).
# Las credenciales salen de distribuido/config.env (no se escriben aquí):
#   cd distribuido && docker compose --env-file config.env up -d
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: wa-rabbitmq
    ports:
      - "5672:5672"      # AMQP: coordinador y workers
      - "15672:15672"    # panel web de RabbitMQ
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:?Defina RABBIT_USER en config.env}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:?Defina RABBIT_PASS en config.env}
    volumes:
      - wa_rabbitmq:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  wa_rabbitmq:

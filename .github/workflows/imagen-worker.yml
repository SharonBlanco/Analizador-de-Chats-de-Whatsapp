# Construye la imagen Docker del worker en GitHub (no en cada máquina) y la publica en GitHub Container
# Registry: ghcr.io/<usuario>/wa-worker:latest. Las máquinas en la nube solo hacen "docker pull".
# Se ejecuta sola en cada push que cambie el código del worker, o a mano desde la pestaña Actions.
name: Imagen del worker

on:
  push:
    branches: [main]
    paths:
      - "distribuido/worker/**"
      - "distribuido/comun.py"
      - "mensajeria/estadisticas.py"
      - "mensajeria/whatsapp_formato.py"
      - ".github/workflows/imagen-worker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen (en minúsculas, como exige Docker)
        id: nombre
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wa-worker" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: distribuido/worker/Dockerfile
          push: true
          tags: |
            ${{ steps.nombre.outputs.imagen }}:latest
            ${{ steps.nombre.outputs.imagen }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
